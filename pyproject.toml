[tool.poetry]
name = "marketplace-blog2"
version = "0.1.0"
description = "\"API for marketplace blog\""
authors = ["Dora_Sh <<dshiryaewa@yandex.ru>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.12"
uvicorn = "^0.34.0"
sqlalchemy = "^2.0.40"
psycopg2-binary = "^2.9.10"
pydantic-settings = "^2.8.1"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.20"
minio = "^7.2.15"
celery = "^5.5.1"
rabbitmq = "^0.2.0"
alembic = "^1.15.2"
email-validator = "^2.2.0"
redis = "^5.0.1"  # Опционально, если захочешь хранить результаты задач
python-dotenv = "^1.0.1"
s3 = "^3.0.0"
pika = "^1.3.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.11.4"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
